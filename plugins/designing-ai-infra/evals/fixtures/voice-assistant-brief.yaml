# Голосовой ассистент в автомобиле (Казахстан). Нужно выбрать место выполнения модели.
requirement:
  time_to_first_audio_ms_p99: 800      # от конца фразы водителя до начала ответа
  data_residency: "сырой звук и расшифровки не покидают страну (требование заказчика и закона)"
  sessions: "до 40 000 одновременных машин в пике, реплика ~ 6 s речи, ответ ~ 40 токенов"
options:
  on_device:
    soc: "автомобильный SoC, 16 GB LPDDR5X общей памяти, 136 GB/s, NPU 45 TOPS INT8"
    system_reserve_gb: 9               # навигация, мультимедиа, ОС
    model: "речевая LLM 3B, INT4 (q4_0-подобный формат), контекст до 4096"
    sustained_power_budget_w: 12
  edge_almaty:
    distance_km: 300
    hardware: "4 x L40S в ЦОД оператора связи"
  cloud_frankfurt:
    distance_km: 4800
    hardware: "H100 в публичном облаке"
network:
  uplink: "LTE, медиана 6 Mbit/s; 4 % времени поездки — провалы < 0.3 Mbit/s длительностью 10-40 s (тоннели, трасса)"
  audio_stream: "Opus 24 kbit/s, отправка кадрами по 20 ms"
team_hypothesis: "Во Франкфурте H100 — самая быстрая модель, увеличим буфер воспроизведения, и провалы связи будут незаметны"
